$kind: http-request
name: Clearcall generic
url: "{{ws-webserver-socket}}/clearcall?callid={{callid}}&deviceid={{deviceid}}&sshdest={{sshdest}}"
method: POST
queryParams:
  callid: "{{callid}}"
  deviceid: "{{deviceid}}"
  sshdest: "{{sshdest}}"
body:
  type: formdata
  content:
    - type: text
      key: callid
      value: "{{callid}}"
    - type: text
      key: deviceid
      value: "{{deviceid}}"
order: 3000
