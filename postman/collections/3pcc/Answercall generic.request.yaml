$kind: http-request
name: Answercall generic
url: http://{{ws-webserver-socket}}/answercall?callid={{callid}}&deviceid={{deviceid}}&sshdest={{3pccsshdest}}
method: POST
queryParams:
  callid: "{{callid}}"
  deviceid: "{{deviceid}}"
  sshdest: "{{3pccsshdest}}"
