$kind: http-request
name: SaveRtpLogs
url: http://localhost:5000/?callid={{callid}}
method: POST
queryParams:
  callid: "{{callid}}"
scripts:
  - type: afterResponse
    code: |-
      let text = pm.response.text();

      let match = text.match(/call id:([^\r\n]+)/);

      if (match) {
          let callId = match[1].trim();
          console.log("Created callid ###" + callId + "###");

          pm.environment.set("callId", callId);
          pm.globals.set("callId",callId);
          return callId;
      }
    language: text/javascript
  - type: beforeRequest
    code: |-
      const callid = String(pm.variables.replaceIn(pm.request.url.query.get("callid") ?? ""));
      let ip = pm.environment.get("baresip_ip");

      a = 255
      b = 254

      const parts = ip.split(".");
      let final_url = "http://" + parts.slice(0, 2).join(".") + "." + a + "." + b + ":5000/savertplog?callid=" + encodeURIComponent(callid)+"&sshdest="+pm.environment.get("3pccsshdest");

      pm.request.url = final_url;
      console.log("FINAL:", final_url);
    language: text/javascript
order: 2039830561162339
