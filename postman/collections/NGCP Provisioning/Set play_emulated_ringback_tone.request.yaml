$kind: http-request
url: https://localhost:1443/api/subscriberpreferences/{{subscriber_id}}
method: PATCH
headers:
  Content-Type: application/json-patch+json
body:
  type: text
  content: '[{"op":"add","path":"/play_emulated_ringback_tone","value":true}]'
auth:
  type: basic
  credentials:
    username: administrator
    password: "{{web-provisioning-password}}"
scripts:
  - type: beforeRequest
    code: |-
      // Force protocol/host/port from the environment; the path and query are left
      // to Postman so that Flows can inject the {{...}} block inputs.
      const clean = (s) => (s || "").trim().replace(/^["']+|["']+$/g, "");

      const ip = clean(pm.environment.get("web-provisioning-ip"));
      if (!ip) {
          throw new Error("environment variable 'web-provisioning-ip' is empty or unset");
      }

      pm.request.url.protocol = "https";
      pm.request.url.host = ip.split(".");
      pm.request.url.port = "1443";

      console.log("FINAL:", pm.request.url.toString());
    language: text/javascript
order: 4032739946439497
