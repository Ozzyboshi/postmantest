$kind: http-request
name: AddCustomHeader -> Baresip compact
url: http://localhost:8000/?useragent={{useragent}}&headername={{headername}}&headervalue={{headervalue}}
method: GET
queryParams:
  useragent: "{{useragent}}"
  headername: "{{headername}}"
  headervalue: "{{headervalue}}"
scripts:
  - type: afterResponse
    code: |-
      let text = pm.response.text();

      let match = text.match(/call id:([^\r\n]+)/);

      if (match) {
          let callId = match[1].trim();
          console.log("Created callid ###" + callId + "###");

          pm.environment.set("callId", callId);
          return callId;
      }
    language: text/javascript
  - type: beforeRequest
    code: |-
      const ua = String(pm.variables.replaceIn(pm.request.url.query.get("useragent") ?? ""));
      let ip = pm.environment.get("baresip_ip");

      let input_number = pm.variables.replaceIn(pm.request.url.query.get("useragent"));
      console.log("baresip useragent is " + input_number);

      let header_name = pm.variables.replaceIn(pm.request.url.query.get("headername"));
      console.log("Header name is " + header_name);

      let header_value = pm.variables.replaceIn(pm.request.url.query.get("headervalue"));
      console.log("Header value is " + header_value);

      input_number = input_number.replace(/@.*$/, '').slice(-7);
      let num = parseInt(input_number, 10);
      if (Number.isNaN(num) && ua.toLowerCase().startsWith("anonymous")) {
          num = 2;
          console.log("maybe anonymous, new number is " + num);
      }
      const n = num % 65536;
      const a = Math.floor(n / 256);
      const b = n % 256;

      const parts = ip.split(".");
      let final_url = "http://" + parts.slice(0, 2).join(".") + "." + a + "." + b + ":8000/?/uaaddheader%20"+header_name+"%3D"+header_value+"%200";

      pm.request.url = final_url;
      console.log("FINAL:", final_url);
    language: text/javascript
order: 2075
